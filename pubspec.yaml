name: altynemel
description: Desktop music player.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  audio_metadata_reader: ^1.8.1
  desktop_drop: ^0.8.4
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  sqlite3: ^3.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest.ttf
