name: altynemel
description: Desktop music player.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  audio_metadata_reader: ^1.8.1
  audio_service: ^0.18.19
  audio_service_mpris: ^0.2.1
  dbus: ^0.7.15
  desktop_drop: ^0.8.4
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  media_kit: ^1.2.6
  media_kit_libs_linux: ^1.2.1
  sqlite3: ^3.5.2
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - LICENSE
    - NOTICE
    - assets/fonts/OFL.txt
  fonts:
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest.ttf
